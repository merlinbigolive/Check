<!-- Supabase Visitor Tracker -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  "use strict";

  const hostname = location.hostname
    .replace(/^www\./i, "")
    .toLowerCase();

  if (hostname !== "vehikal.com") return;

  const SUPABASE_URL = "https://oznaxystqkkmaipqmjay.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ZN3bUvIig48tAuwbOrdhug_NZ7VOgnJ";

  // Count only once per browser tab session.
  const VISIT_KEY = "vehikal_visit_recorded";

  if (sessionStorage.getItem(VISIT_KEY)) return;

  if (!window.supabase) {
    console.error("Vehikal tracker: Supabase library failed to load.");
    return;
  }

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const userAgent = navigator.userAgent || "";

  const isBot =
    /bot|crawler|spider|slurp|headless|facebookexternalhit/i.test(userAgent);

  async function recordVisit() {
    const { error } = await client
      .from("visitor_logs")
      .insert({
        domain: "vehikal.com",
        visitor_type: isBot ? "bot" : "human",
        user_agent: userAgent.slice(0, 1000),
        referrer: document.referrer || null,
        page_path: location.pathname,
        timestamp: new Date().toISOString()
      });

    if (error) {
      console.error("Vehikal visitor recording failed:", error.message);
      return;
    }

    sessionStorage.setItem(VISIT_KEY, "1");
    console.log("Vehikal visitor recorded successfully.");
  }

  recordVisit().catch(function (error) {
    console.error("Vehikal visitor tracker error:", error);
  });
})();
</script>
